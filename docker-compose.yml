# caps each container's log at 3 files of 10MB, so logs can't fill the disk on the VM
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgis/postgis:17-3.5
    container_name: aichair-db
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # these run in name order, only when pgdata is empty: the table, then the survey reports
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      # -h 127.0.0.1 checks over TCP like the API does. first-time setup only accepts
      # local socket connections, so without it this passes before the API can connect
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    container_name: aichair-api
    restart: unless-stopped
    logging: *logging
    ports:
      # only reachable from this machine (and `npm run dev`); everyone else goes through nginx
      - "127.0.0.1:8001:8001"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # /health also checks the database. the image has python but not curl
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    # serves the built frontend and forwards API requests, see nginx/Dockerfile
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: aichair-nginx
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
    environment:
      SERVER_NAME: ${SERVER_NAME}
    depends_on:
      - api

volumes:
  pgdata:
